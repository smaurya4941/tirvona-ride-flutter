name: tirvona_ride
description: "Tirvona Rides — pilgrimage-focused ride booking for customers and drivers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^9.2.4
  go_router: ^18.0.1
  image_picker: ^1.1.2
  socket_io_client: ^3.1.6
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  razorpay_flutter: ^1.4.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  share_plus: ^12.0.2
  google_maps_flutter: ^2.18.2
  path_provider: ^2.1.5
  speech_to_text: ^7.5.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash_art.png
    - assets/images/logo.png
